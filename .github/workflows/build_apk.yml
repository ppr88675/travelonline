name: Build Android APK

# ⭐ 改為僅限「手動點擊觸發」，改檔案時不再自動偷跑
on:
  workflow_dispatch:

# 若手動連續點擊，自動取消前一個未完成的任務
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 設定 Java 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 雲端自動生成 Android 原生配置 (若本機未建立)
        run: |
          if [ ! -d "android" ]; then
            echo "偵測到缺少 android 資料夾，自動由 Flutter 建立原生骨架..."
            cp -r lib lib_backup
            cp pubspec.yaml pubspec.yaml.bak
            flutter create . --platforms=android --org com.travelplanner
            rm -rf lib
            mv lib_backup lib
            mv pubspec.yaml.bak pubspec.yaml
          fi

      - name: 下載 Flutter 套件
        run: flutter pub get

      # ⭐ 一次性完整排除 Isar 在 AGP 8+ 的三大隱藏地雷（防重複寫入 + SDK 36 + 移除舊版 package 屬性）
      - name: 一次性完整修復 Isar 與新版 Android SDK 36 / AGP 8+ 相容性
        run: |
          for f in $(find ~/.pub-cache -path "*/isar_flutter_libs*/android/build.gradle"); do
            grep -q "namespace" "$f" || sed -i 's/android {/android {\n    namespace "dev.isar.isar_flutter_libs"/' "$f"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$f"
          done
          for m in $(find ~/.pub-cache -path "*/isar_flutter_libs*/android/src/main/AndroidManifest.xml"); do
            sed -i 's/package="dev.isar.isar_flutter_libs"//g' "$m"
          done

      - name: 生成 Isar 資料庫存取代碼
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 編譯 Release APK
        run: flutter build apk --release

      - name: 上傳 APK 成品至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TravelPlanner-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
