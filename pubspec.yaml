name: travel_planner
description: "Offline-first travel itinerary & packing checklist app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 狀態管理
  flutter_riverpod: ^2.5.1

  # 本地高速資料庫 (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # 日期格式化與工具
  intl: ^0.19.0

  # 離線地圖導航與外部呼叫 (支援 geo: 與 Google Maps / 本地地圖 App)
  url_launcher: ^6.3.0

  # 雲端非同步備份 (Google Drive)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # UI 輔助
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Isar 程式碼產生器
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true